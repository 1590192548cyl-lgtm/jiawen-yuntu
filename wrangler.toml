name = "jiawen-ai"
main = "worker.js"
compatibility_date = "2026-08-14"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1590192548"

  [ratelimits.simple]
  limit = 12
  period = 60

# 说明：
# - MODEL_API_KEY / TAVILY_API_KEY 属于机密，请通过 Cloudflare 控制台
#   （Settings -> Variables and Secrets）或 `wrangler secret put` 配置，
#   不要写入本文件，也不要提交到 GitHub。
# - 上线前建议设置 ALLOWED_ORIGINS，仅允许正式站点域名访问。
# - MODEL_NAME / MODEL_API_BASE 可作为普通环境变量配置，不属于密钥。
